<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lies Geschichten und übe deine Stapel mit Linglossa. Dein Lernstand begleitet dich auf Handy und im Browser.">
  <meta name="theme-color" content="#0D0F14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Linglossa">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Linglossa · Lesen und Lernen</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0D0F14; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center;
      gap: 20px; color: #F4F3F0; text-align: center; font: 15px system-ui, sans-serif; }
    #loading svg { width: 52px; height: 52px; margin: auto; }
    #loading p { margin: 0; }
    #loading .hint { font-size: 13px; color: #AAAEB9; }
    noscript { color: #F4F3F0; font: 17px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M12 15c9-3 15-1 20 4 5-5 11-7 20-4v34c-8-3-14-1-20 3-6-4-12-6-20-3V15Z" stroke="#F77F00" stroke-width="4" stroke-linejoin="round"/>
      <path d="M32 20v30" stroke="#F77F00" stroke-width="4"/>
    </svg>
    <p>Linglossa wird geöffnet …</p>
    <p class="hint">Dein Platz zum Lesen und Lernen.</p>
  </div>
  <noscript>Bitte aktiviere JavaScript, um Linglossa zu verwenden.</noscript>
  <script>window.addEventListener('flutter-first-frame', function () { document.getElementById('loading')?.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
