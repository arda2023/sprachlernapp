# No secrets: Anthropic key only in process environment; Vertex uses ADC.

out_dir: out

lemmas:
  lang: en
  top_n: 5000            # wordfreq top_n_list
  pos_allowed: [NOUN, VERB, ADJ, ADV]   # pilot; function words stay out (open decision)
  max_rank: 60           # pilot: ranks 1–60
  spacy_model: en_core_web_sm

linter:
  max_words: 14
  max_subclauses: 1
  min_zipf: {anfaenger: 4.0, mittel: 3.5, fortgeschritten: 3.0}

# Price table for the cost ledger (USD per 1M tokens). Checked against the
# Anthropic direct short-context price (2026-10-19); retained Vertex EU and
# historical Gemini snapshot (2026-10-18). Standard, no Priority/Flex/Batch.
# Haiku output already includes thinking; local requests stay below 100K.
prices:
  status: geprüft
  as_of: "2026-10-19"    # date the prices were read
  source: https://cloud.google.com/vertex-ai/generative-ai/pricing   # redirects to https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
  models:
    claude-haiku-5-5:
      # Direct API, standard short context; output includes thinking.
      source: https://platform.claude.com/docs/en/models/haiku-5-5/overview
      input_per_mtok_usd: 0.10
      output_per_mtok_usd: 0.50
      thinking_per_mtok_usd: 0.50
      vertex_eu:
        input_per_mtok_usd: 0.11
        output_per_mtok_usd: 0.55
        thinking_per_mtok_usd: 0.55
    gemini-3.8-flash:
      input_per_mtok_usd: 0.75
      output_per_mtok_usd: 3.75
      thinking_per_mtok_usd: 3.75
      intro_until: "2026-12-31"   # introductory price, ends 2026-12-31
      after_intro: {input_per_mtok_usd: 1.50, output_per_mtok_usd: 7.50, thinking_per_mtok_usd: 7.50}   # from 2027-01-01
    gemini-2.5-flash:
      input_per_mtok_usd: 0.30
      output_per_mtok_usd: 2.50
      thinking_per_mtok_usd: 2.50

# Local editorial pipeline: direct Anthropic, no EU-only guarantee.
# Vertex remains an explicit alternative; no fallback or production run.
llm:
  provider: anthropic    # anthropic | vertex; key only via ANTHROPIC_API_KEY
  # Used only with provider: vertex:
  project: sprachlernapp-510508
  location: eu
  generate_model: claude-haiku-5-5
  generate_thinking: {type: disabled}
  blindtest_model: claude-haiku-5-5
  blindtest_thinking: {type: disabled}
  meaning_check_model: claude-haiku-5-5
  meaning_check_thinking: {type: disabled}
  alternative_check_model: claude-haiku-5-5
  alternative_check_thinking: {type: disabled}
  effort: low
  timeout_s: 30
  total_timeout_s: 95
  max_attempts: 3
  max_output_tokens: {meanings: 2048, sentences: 2048, annotate: 4096, blindtest: 256, meaning_check: 4096, classify_usage: 1024, alternative_check: 1024}

generate:
  concurrency: 8
  lang: en
  gloss_lang: de
  top_n: 5000            # wordfreq ranks for candidate forms
  lint_retries: 2        # regenerate a sentence with a linter error at most 2x
  blind_retries: 1       # regenerate a sentence that fails the blind test 1x
  situations:
    - Arbeit
    - Küche
    - Reise
    - Schule
    - Wetter
    - Einkaufen
    - Familie
    - Gesundheit
    - Sport
    - Wohnen
    - Technik
    - Freizeit
    - Nachbarschaft
    - Restaurant
    - Bahnhof
    - Busfahrt
    - Garten
    - Bibliothek
    - Arztbesuch
    - Geburtstag
    - Urlaub
    - Haustiere
    - Kleidung
    - Musik
    - Haushalt
    - Büro
    - Park
    - Post
    - Freundschaft
    - Stadtleben
  names: [Mia, Leo, Sara, Amir, Emma, Luca, Sofia, Noah, Maya, Elias, Lina, Omar, Eva, Ben, Nina, Ali, Rosa, Luis, Zoe, David]

smoke_forms: [went, left, about, up, light]
